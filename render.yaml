# Déploiement Render.
#
# Le port n'est jamais fixé ici : Render l'attribue par la variable PORT, et
# « next start » la lit seul. Un port codé en dur — c'était le cas — fait
# déclarer le service en échec, faute de réponse sur celui que Render surveille.
#
# La base n'est pas décrite dans ce fichier. Treize gigaoctets de données ne se
# recréent pas à chaque déploiement, et une base déclarée ici serait liée au
# cycle de vie du service. Créez-la à part, puis collez son URL interne dans
# DATABASE_URL.

services:
  - type: web
    name: recours-france
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Le schéma est appliqué avant que la nouvelle version ne prenne le trafic.
    #
    # Sans cela, la base créée chez l'hébergeur reste vide de tables : la
    # connexion s'établit, `SELECT 1` répond, et chaque page qui lit une table
    # renvoie 500 sur un « P2021: The table public.Signalement does not exist ».
    # Une panne trompeuse, puisque la sonde de vie, elle, répond 200.
    #
    # `preDeployCommand` est la place prévue par Render pour cela : après la
    # compilation, avant le démarrage. Sans `--accept-data-loss` à dessein —
    # une modification de schéma qui détruirait des données doit faire échouer
    # le déploiement, pas s'appliquer en silence.
    preDeployCommand: npx prisma db push --skip-generate
    # /api/vivant, surtout pas /api/sante : cette dernière répond 503 dès
    # qu'une tâche planifiée est en retard — bon pour une alerte, désastreux
    # pour une sonde, qui redémarrerait un service en parfait état de marche.
    healthCheckPath: /api/vivant
    # Aucun disque. Les justificatifs vivent en base, dans la table
    # ContenuJustificatif : la ligne et les octets sont écrits, sauvegardés et
    # restaurés ensemble. Sur un disque d'hébergeur, éphémère, les pièces
    # disparaissaient à chaque déploiement tandis que leur ligne subsistait —
    # un justificatif introuvable que le déposant croyait versé.
    #
    # Le service n'est plus attaché à une machine : la mise à l'échelle
    # horizontale redevient possible le jour où elle servira.
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Renseignées dans l'interface, jamais ici : ce fichier est versionné.
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Le domaine définitif. Elle gouverne les canoniques, le robots.txt, les
      # tranches du plan de site et les liens de suivi des courriels : la
      # changer après une indexation coûterait des mois de reconsolidation.
      - key: APP_URL
        value: https://recours-france.fr
      - key: MAIL_ENABLED
        value: "true"
      - key: MAIL_FROM
        value: contact@recours-france.fr
      # Adresse de réponse, et destinataire des alertes de tâches en échec.
      # Le code les lit (lib/taches.ts, lib/mailer.ts) mais elles manquaient
      # ici : sans elles, une chaîne planifiée qui tombe n'alerte personne.
      - key: MAIL_REPLY_TO
        sync: false
      - key: ALERTE_EMAIL
        sync: false
      # Le bandeau « démonstration — données fictives » doit disparaître.
      - key: DEMO_BANNER
        value: "false"
      # La détection de site interroge des serveurs tiers : à activer une fois
      # le service stable, pas au premier déploiement.
      - key: ENRICHISSEMENT_SITE_ACTIF
        value: "false"
      # Palier d'ouverture du plan de site : 1 = les ~86 000 fiches portant un
      # signal réel, 2 = les ~3,26 M en secteur grand public, 3 = toutes les
      # actives. On élargit au vu de la Search Console, jamais au calendrier —
      # d'où une variable, modifiable sans redéployer de code.
      - key: SEO_PALIER
        value: "1"

      # ── Mentions légales ──────────────────────────────────────────────
      # Obligatoires (LCEN art. 6 III, code de commerce art. R123-237), et
      # impossibles à deviner depuis le code : une adresse de siège inventée
      # engagerait la société sur une information fausse. Tant qu'elles sont
      # vides, /mentions-legales affiche un avertissement et
      # « npm run verifier:mise-en-ligne » refuse le feu vert.
      - key: EDITEUR_RAISON_SOCIALE
        sync: false
      - key: EDITEUR_FORME
        sync: false
      - key: EDITEUR_CAPITAL
        sync: false
      - key: EDITEUR_ADRESSE
        sync: false
      - key: EDITEUR_CODE_POSTAL
        sync: false
      - key: EDITEUR_VILLE
        sync: false
      - key: EDITEUR_SIREN
        sync: false
      - key: EDITEUR_RCS_VILLE
        sync: false
      - key: EDITEUR_TVA
        sync: false
      - key: EDITEUR_DIRECTEUR_PUBLICATION
        sync: false
      # À recopier depuis les mentions légales de l'hébergeur lui-même. Les
      # citer de mémoire est le plus sûr moyen de publier une adresse fausse.
      - key: HEBERGEUR_NOM
        sync: false
      - key: HEBERGEUR_ADRESSE
        sync: false
      - key: HEBERGEUR_TELEPHONE
        sync: false

# ── Tâches planifiées ────────────────────────────────────────────────────
# Elles se surveillent mutuellement : une tâche qui ne s'exécute pas est une
# anomalie, et /api/sante répond 503 quand une chaîne prend du retard.
#
# Les décomptes de l'annuaire balaient treize millions de lignes : une fois par
# nuit suffit, le répertoire Sirene n'étant publié qu'une fois par mois.
  - type: cron
    name: recours-compteurs
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    schedule: "15 3 * * *"
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run compteurs
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: recours-relances
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    schedule: "30 7 * * *"
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run relances
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_ENABLED
        value: "true"

  - type: cron
    name: recours-contestations
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    schedule: "45 7 * * *"
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run contestations
    envVars:
      - key: DATABASE_URL
        sync: false
